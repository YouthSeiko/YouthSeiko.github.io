name: Notify IndexNow after Pages
on:
  page_build:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: indexnow-public-site
  cancel-in-progress: false
jobs:
  notify:
    if: github.event_name == 'workflow_dispatch' || github.event.build.status == 'built'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read the published source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Submit deployed canonical URLs to IndexNow
        run: python3 tools/notify_indexnow.py
